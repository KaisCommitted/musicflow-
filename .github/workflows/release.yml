name: Release

# Push a tag like v1.2.3 to build the Windows installer and publish it as a GitHub Release.
# Auto-update inside the app is intentionally not wired up yet — this just automates getting
# a properly-versioned installer onto Releases, since electron-builder needs GH_TOKEN either
# way and it's the same handful of steps as building locally.
on:
  push:
    tags:
      - "v*.*.*"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "24"

      - uses: actions/setup-python@v5
        with:
          python-version: "3.14"

      - name: Build frontend
        working-directory: musicflow-dash
        run: |
          npm ci
          npm run build

      - name: Install backend dependencies
        working-directory: musicflow-api
        run: |
          py -m pip install --upgrade pip
          py -m pip install -r requirements.txt pyinstaller

      - name: Fetch ffmpeg (bundled with the backend for downloads)
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force -Path musicflow-api/bin | Out-Null
          Invoke-WebRequest -Uri "https://github.com/BtbN/FFmpeg-Builds/releases/download/latest/ffmpeg-master-latest-win64-gpl.zip" -OutFile ffmpeg.zip
          Expand-Archive ffmpeg.zip -DestinationPath ffmpeg-extracted
          $bin = Get-ChildItem -Path ffmpeg-extracted -Recurse -Filter "ffmpeg.exe" | Select-Object -First 1
          Copy-Item $bin.FullName musicflow-api/bin/ffmpeg.exe
          $probe = Get-ChildItem -Path ffmpeg-extracted -Recurse -Filter "ffprobe.exe" | Select-Object -First 1
          Copy-Item $probe.FullName musicflow-api/bin/ffprobe.exe

      # yt-dlp needs a JS runtime to solve YouTube's JS challenge for its best audio formats —
      # without one, downloads 403 even though extraction/search still works fine.
      - name: Fetch Deno (JS runtime yt-dlp needs for YouTube's challenge-solving)
        shell: pwsh
        run: |
          Invoke-WebRequest -Uri "https://github.com/denoland/deno/releases/latest/download/deno-x86_64-pc-windows-msvc.zip" -OutFile deno.zip
          Expand-Archive deno.zip -DestinationPath musicflow-api/bin -Force

      # Bundled so anonymous downloads (no YouTube login connected) can still get a PO token —
      # see find_node()/find_pot_server() in main.py. Portable node.exe only (no install), same
      # bundling shape as ffmpeg/deno above.
      - name: Fetch Node.js (bundled for the PO token provider)
        shell: pwsh
        run: |
          $latest24 = (Invoke-RestMethod -Uri "https://nodejs.org/dist/index.json") | Where-Object { $_.version -like "v24.*" } | Select-Object -First 1
          Invoke-WebRequest -Uri "https://nodejs.org/dist/$($latest24.version)/node-$($latest24.version)-win-x64.zip" -OutFile node.zip
          Expand-Archive node.zip -DestinationPath node-extracted
          $nodeExe = Get-ChildItem -Path node-extracted -Recurse -Filter "node.exe" | Select-Object -First 1
          Copy-Item $nodeExe.FullName musicflow-api/bin/node.exe

      # bgutil-ytdlp-pot-provider's server component isn't published as a build artifact, only
      # source — built here the same way its own README documents (npm ci && npx tsc), pruned
      # to production dependencies only, then bundled as data (see musicflow-backend.spec).
      # Tracking master rather than pinning a tag, same "just take latest, verified working at
      # setup time" approach as ffmpeg/Deno above — and requirements.txt's pip install of the
      # plugin side is unpinned too, so this keeps both halves in step with each other.
      - name: Build PO token provider server
        shell: pwsh
        run: |
          git clone --single-branch --branch master https://github.com/Brainicism/bgutil-ytdlp-pot-provider.git bgutil-src
          Push-Location bgutil-src/server
          npm ci
          npx tsc
          npm prune --omit=dev
          Pop-Location
          New-Item -ItemType Directory -Force -Path musicflow-api/bin/bgutil-server | Out-Null
          Copy-Item -Recurse bgutil-src/server/build musicflow-api/bin/bgutil-server/build
          Copy-Item -Recurse bgutil-src/server/node_modules musicflow-api/bin/bgutil-server/node_modules
          Copy-Item bgutil-src/server/package.json musicflow-api/bin/bgutil-server/package.json

      - name: Freeze backend with PyInstaller
        working-directory: musicflow-api
        run: py -m PyInstaller musicflow-backend.spec --noconfirm

      - name: Set package version from tag
        shell: pwsh
        working-directory: musicflow-electron
        run: |
          $version = "${{ github.ref_name }}" -replace '^v', ''
          npm pkg set version=$version

      - name: Install Electron dependencies
        working-directory: musicflow-electron
        run: npm ci

      # electron-builder publishes several artifacts (installer, .blockmap, latest.yml) as
      # near-simultaneous uploads. If the release doesn't exist yet, each upload independently
      # tries to create it — that race has, in practice, created two separate draft releases
      # for the same tag instead of one, splitting the assets between them. Pre-creating an
      # empty draft here means every upload finds it already exists and just attaches to it.
      - name: Pre-create the GitHub release (avoids a create-race across artifact uploads)
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: gh release create "${{ github.ref_name }}" --draft --title "${{ github.ref_name }}" --notes ""

      - name: Build and publish installer
        working-directory: musicflow-electron
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: npx electron-builder --win --publish always

      # electron-builder uploads to the release created above but leaves it in draft — publish
      # it so it actually shows up on /releases/latest (what the README's download link uses).
      - name: Publish the release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: gh release edit "${{ github.ref_name }}" --draft=false
